name: Hardware Chisel CI

on:
  push:
    paths:
      - "hardware/chisel/**"
      - ".github/workflows/hardware-chisel.yml"
  pull_request:
    paths:
      - "hardware/chisel/**"
      - ".github/workflows/hardware-chisel.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware/chisel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Run Chisel tests
        run: sbt test
